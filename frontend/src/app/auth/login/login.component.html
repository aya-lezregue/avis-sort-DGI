<div class="login-wrapper">

  <!-- Panneau gauche : identité visuelle -->
  <div class="brand-panel">
    <div class="brand-content">
      <img src="images\poste.png" alt="Barid Al Maghrib" class="brand-logo">
      <h1 class="brand-title">Avis de Sort DGI</h1>
      <p class="brand-subtitle">Plateforme de gestion et de suivi des avis de sort</p>

      <div class="brand-features">
        <div class="feature-item">
          <span class="feature-icon">📋</span>
          <span>Suivi en temps réel des dossiers</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">🔒</span>
          <span>Accès sécurisé par rôle</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">📊</span>
          <span>Traitement automatisé des flux DGI</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Panneau droit : formulaire -->
  <div class="form-panel">
    <div class="form-container">

      <h2 class="form-title">Connexion</h2>
      <p class="form-subtitle mb-4">Accédez à votre espace de travail</p>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
              </svg>
            </span>
            <input
              type="text"
              class="form-control border-start-0"
              [(ngModel)]="username"
              name="username"
              placeholder="votre.identifiant"
              required
              autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2"/>
              </svg>
            </span>
            <input
              type="password"
              class="form-control border-start-0"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required>
          </div>
        </div>

        <div class="alert alert-danger py-2 small" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-barid w-100 py-2 mt-2"
          [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Se connecter
        </button>
      </form>

      <p class="text-center text-muted small mt-4 mb-0">
        © 2026 Barid Al Maghrib — Direction Générale des Impôts
      </p>

    </div>
  </div>

</div>
